name: UAT Terraform CD Pipeline

on:
  push:
    branches:
      - uat
    paths:
      - "infra/env/uat/**"
      - "infra/modules/**"
      - ".github/workflows/**"
      - "scripts/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: infra/env/uat

  TFVARS_FILE: contact-evaluations-pipeline.tfvars
  TFVARS_S3_KEY: terraform/uat/af-south-1/contact-evaluations-pipeline.tfvars

  PLAN_FILE: tfplan
  PLAN_S3_KEY: artifacts/uat/contact-evaluations-pipeline/${{ github.run_id }}/tfplan

  NETWORK_CONNECTION_RESOURCE_ADDRESS: module.compute.aws_glue_connection.network_connection


jobs:
  # ==========================================================
  # VALIDATE
  # ==========================================================
  validate:
    name: Validate Terraform

    runs-on: codebuild-npsenvoiceuat-uat-afs1-contact-evaluations-pipeline-${{ github.run_id }}-${{ github.run_attempt }}

    environment: uat
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Netskope certificate
        run: |
          aws s3 cp \
            "s3://${{ vars.CERTIFICATE_S3_BUCKET_NAME }}/bundle.pem" \
            ./bundle.pem

      - name: Configure SSL certificate
        run: |
          sudo cp ./bundle.pem /etc/pki/ca-trust/source/anchors/bundle.pem
          sudo update-ca-trust

          echo "NODE_EXTRA_CA_CERTS=$(pwd)/bundle.pem" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$(pwd)/bundle.pem" >> "$GITHUB_ENV"

      - name: Install Terraform
        run: |
          sudo yum install -y yum-utils

          sudo yum-config-manager \
            --add-repo \
            https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo

          sudo yum install -y terraform

          terraform --version

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate


  # ==========================================================
  # IMPORT SHARED CONNECTION AND CREATE PLAN
  # ==========================================================
  plan:
    name: Import Connection and Terraform Plan

    needs:
      - validate

    runs-on: codebuild-npsenvoiceuat-uat-afs1-contact-evaluations-pipeline-${{ github.run_id }}-${{ github.run_attempt }}

    environment: uat
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Netskope certificate
        run: |
          aws s3 cp \
            "s3://${{ vars.CERTIFICATE_S3_BUCKET_NAME }}/bundle.pem" \
            ./bundle.pem

      - name: Configure SSL certificate
        run: |
          sudo cp ./bundle.pem /etc/pki/ca-trust/source/anchors/bundle.pem
          sudo update-ca-trust

          echo "NODE_EXTRA_CA_CERTS=$(pwd)/bundle.pem" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$(pwd)/bundle.pem" >> "$GITHUB_ENV"

      - name: Install Terraform
        run: |
          sudo yum install -y yum-utils

          sudo yum-config-manager \
            --add-repo \
            https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo

          sudo yum install -y terraform

          terraform --version

      - name: Fetch Terraform variables
        run: |
          aws s3 cp \
            "s3://${{ vars.TF_VARIABLES_BUCKET_NAME }}/${{ env.TFVARS_S3_KEY }}" \
            "./${{ env.TFVARS_FILE }}"

          test -s "./${{ env.TFVARS_FILE }}"

          echo "Terraform variables file downloaded successfully."

      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Import the existing UAT shared Glue network connection
      # only when it is not already in the CE Terraform state.
      # --------------------------------------------------------
      - name: Import existing shared Glue network connection
        env:
          NETWORK_CONNECTION_IMPORT_ID: ${{ vars.NETWORK_GLUE_CONNECTION_IMPORT_ID }}
        run: |
          if [ -z "${NETWORK_CONNECTION_IMPORT_ID}" ]; then
            echo "NETWORK_GLUE_CONNECTION_IMPORT_ID is not configured."
            exit 1
          fi

          echo "Checking whether the shared Glue connection is already in Terraform state..."

          if terraform state show \
            "${{ env.NETWORK_CONNECTION_RESOURCE_ADDRESS }}" \
            >/dev/null 2>&1; then

            echo "Shared Glue network connection is already present in Terraform state."
          else
            echo "Importing existing shared Glue network connection..."

            terraform import \
              -input=false \
              -var-file="${{ env.TFVARS_FILE }}" \
              "${{ env.NETWORK_CONNECTION_RESOURCE_ADDRESS }}" \
              "${NETWORK_CONNECTION_IMPORT_ID}"

            echo "Shared Glue network connection imported successfully."
          fi

      # --------------------------------------------------------
      # Confirm the connection imported into Terraform state.
      # --------------------------------------------------------
      - name: Verify imported network connection in Terraform state
        run: |
          echo "Imported Terraform resource:"
          echo "${{ env.NETWORK_CONNECTION_RESOURCE_ADDRESS }}"

          terraform state show \
            "${{ env.NETWORK_CONNECTION_RESOURCE_ADDRESS }}"

      # --------------------------------------------------------
      # Inspect the actual UAT Glue connection through AWS.
      # This uses the CodeBuild runner credentials.
      # --------------------------------------------------------
      - name: Inspect UAT Glue network connection
        run: |
          CONNECTION_NAME="$(
            awk -F '=' '
              /^[[:space:]]*network_glue_connection_name[[:space:]]*=/ {
                value = $2
                sub(/^[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                gsub(/"/, "", value)
                print value
                exit
              }
            ' "${{ env.TFVARS_FILE }}"
          )"

          if [ -z "${CONNECTION_NAME}" ]; then
            echo "Could not read network_glue_connection_name from ${{ env.TFVARS_FILE }}."
            exit 1
          fi

          echo "Inspecting Glue network connection: ${CONNECTION_NAME}"

          aws glue get-connection \
            --name "${CONNECTION_NAME}" \
            --hide-password \
            --query 'Connection.{
              Name:Name,
              ConnectionType:ConnectionType,
              SubnetId:PhysicalConnectionRequirements.SubnetId,
              SecurityGroupIds:PhysicalConnectionRequirements.SecurityGroupIdList,
              AvailabilityZone:PhysicalConnectionRequirements.AvailabilityZone
            }' \
            --output json

      # --------------------------------------------------------
      # Confirm the imported connection has the required
      # physical VPC connection properties.
      # --------------------------------------------------------
      - name: Validate UAT Glue network connection properties
        run: |
          CONNECTION_NAME="$(
            awk -F '=' '
              /^[[:space:]]*network_glue_connection_name[[:space:]]*=/ {
                value = $2
                sub(/^[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                gsub(/"/, "", value)
                print value
                exit
              }
            ' "${{ env.TFVARS_FILE }}"
          )"

          CONNECTION_TYPE="$(
            aws glue get-connection \
              --name "${CONNECTION_NAME}" \
              --hide-password \
              --query 'Connection.ConnectionType' \
              --output text
          )"

          SUBNET_ID="$(
            aws glue get-connection \
              --name "${CONNECTION_NAME}" \
              --hide-password \
              --query 'Connection.PhysicalConnectionRequirements.SubnetId' \
              --output text
          )"

          SECURITY_GROUP_COUNT="$(
            aws glue get-connection \
              --name "${CONNECTION_NAME}" \
              --hide-password \
              --query 'length(Connection.PhysicalConnectionRequirements.SecurityGroupIdList)' \
              --output text
          )"

          AVAILABILITY_ZONE="$(
            aws glue get-connection \
              --name "${CONNECTION_NAME}" \
              --hide-password \
              --query 'Connection.PhysicalConnectionRequirements.AvailabilityZone' \
              --output text
          )"

          echo "Connection name: ${CONNECTION_NAME}"
          echo "Connection type: ${CONNECTION_TYPE}"
          echo "Subnet ID: ${SUBNET_ID}"
          echo "Security group count: ${SECURITY_GROUP_COUNT}"
          echo "Availability Zone: ${AVAILABILITY_ZONE}"

          if [ "${CONNECTION_TYPE}" != "NETWORK" ]; then
            echo "The imported Glue connection is not a NETWORK connection."
            exit 1
          fi

          if [ -z "${SUBNET_ID}" ] || [ "${SUBNET_ID}" = "None" ]; then
            echo "The imported Glue network connection has no subnet."
            exit 1
          fi

          if [ -z "${SECURITY_GROUP_COUNT}" ] \
            || [ "${SECURITY_GROUP_COUNT}" = "None" ] \
            || [ "${SECURITY_GROUP_COUNT}" -lt 1 ]; then
            echo "The imported Glue network connection has no security group."
            exit 1
          fi

          echo "The imported UAT Glue network connection has valid VPC properties."

      - name: Wait before creating Terraform plan
        run: |
          echo "Waiting 60 seconds before planning the Glue jobs..."
          sleep 60

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file="${{ env.TFVARS_FILE }}" \
            -out="${{ env.PLAN_FILE }}"

      - name: Show Glue job connections from Terraform plan
        run: |
          terraform show -no-color "${{ env.PLAN_FILE }}" \
            | grep -A 8 -B 4 "connections" \
            || true

      - name: Upload Terraform plan to S3
        run: |
          aws s3 cp \
            "${{ env.PLAN_FILE }}" \
            "s3://${{ vars.ARTIFACTS_BUCKET_NAME }}/${{ env.PLAN_S3_KEY }}"

          echo "Terraform plan uploaded successfully."


  # ==========================================================
  # APPLY
  # ==========================================================
  apply:
    name: Terraform Apply

    needs:
      - plan

    runs-on: codebuild-npsenvoiceuat-uat-afs1-contact-evaluations-pipeline-${{ github.run_id }}-${{ github.run_attempt }}

    environment: uat
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Netskope certificate
        run: |
          aws s3 cp \
            "s3://${{ vars.CERTIFICATE_S3_BUCKET_NAME }}/bundle.pem" \
            ./bundle.pem

      - name: Configure SSL certificate
        run: |
          sudo cp ./bundle.pem /etc/pki/ca-trust/source/anchors/bundle.pem
          sudo update-ca-trust

          echo "NODE_EXTRA_CA_CERTS=$(pwd)/bundle.pem" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$(pwd)/bundle.pem" >> "$GITHUB_ENV"

      - name: Install Terraform
        run: |
          sudo yum install -y yum-utils

          sudo yum-config-manager \
            --add-repo \
            https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo

          sudo yum install -y terraform

          terraform --version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform plan
        run: |
          aws s3 cp \
            "s3://${{ vars.ARTIFACTS_BUCKET_NAME }}/${{ env.PLAN_S3_KEY }}" \
            "${{ env.PLAN_FILE }}"

          test -s "${{ env.PLAN_FILE }}"

          echo "Terraform plan downloaded successfully."

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            "${{ env.PLAN_FILE }}"
